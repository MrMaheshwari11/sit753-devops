services:
  stock-app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    container_name: sit753-stock-app
    restart: unless-stopped
    environment:
      APP_ENV: production
    volumes:
      - production-data:/app/data
    ports:
      - "8080:5000"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: sit753-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ${CONFIG_DIR}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_DIR}/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: sit753-alertmanager
    restart: unless-stopped
    volumes:
      - ${CONFIG_DIR}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

  mailpit:
    image: axllent/mailpit:latest
    container_name: sit753-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - monitoring

networks:
  monitoring:
volumes:
  production-data:
    name: sit753-production-data

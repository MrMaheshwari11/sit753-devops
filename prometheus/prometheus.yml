global:
  scrape_interval: 15s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: stock-app
    metrics_path: /metrics
    static_configs:
      - targets: ["stock-app:5000"]

global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@sit753.local
  smtp_require_tls: false
route:
  receiver: demo-team-mailbox
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
receivers:
  - name: demo-team-mailbox
    email_configs:
      - to: devops-team@sit753.local
        send_resolved: true
